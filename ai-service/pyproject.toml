[project]
name = "ai-bos-ai-service"
version = "0.1.0"
description = "Production-ready AI microservice for AI Business Operating System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "langchain>=0.2.14",
  "langchain-core>=0.2.35",
  "langgraph>=0.2.14",
  "pypdf>=4.3.0",
  "python-docx>=1.1.2",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1.5",
]

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
